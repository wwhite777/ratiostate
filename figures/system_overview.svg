<text x="42" y="43" dominant-baseline="middle" text-anchor="start" fill="#182F45" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700">RatioState  |  recurrent storage-precision experiment</text>
<text x="42" y="78" dominant-baseline="middle" text-anchor="start" fill="#526579" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">One unchanged model; six ways to retain its state between pixel calls</text>
