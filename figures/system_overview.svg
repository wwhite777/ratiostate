<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">RatioState recurrent storage precision experiment</title>
<desc id="desc">An unchanged FP32 model predicts a pixel from teacher-forced input and expanded stored state. The current readout uses raw updated matrix and normalizer. Only after the call are states encoded in one of six formats and retained for the next call. Ten development images precede a locked six-arm comparison on 32 disjoint images, each with 783 predictions scored separately.</desc>
