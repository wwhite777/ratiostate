<text x="347" y="245" dominant-baseline="middle" text-anchor="start" fill="#526579" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400">8 layers  ·  8 heads/layer</text>
<text x="347" y="271" dominant-baseline="middle" text-anchor="start" fill="#526579" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Per attention head: Ŝ, ẑ = decoded feeds</text>
<line x1="346" y1="287" x2="755" y2="287" stroke="#D8E6ED" stroke-width="1" stroke-linecap="round"/>
<text x="347" y="317" dominant-baseline="middle" text-anchor="start" fill="#182F45" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400">Sₜ = Ŝₜ₋₁ + kₜ vₜᵀ</text>
<text x="347" y="351" dominant-baseline="middle" text-anchor="start" fill="#182F45" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400">zₜ = ẑₜ₋₁ + kₜ</text>
<text x="347" y="390" dominant-baseline="middle" text-anchor="start" fill="#182F45" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400">yₜ = (qₜᵀ Sₜ) / (qₜᵀ zₜ + ε)</text>
