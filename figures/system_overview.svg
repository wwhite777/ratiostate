<text x="70" y="310" dominant-baseline="middle" text-anchor="start" fill="#182F45" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">position t</text>
<text x="70" y="343" dominant-baseline="middle" text-anchor="start" fill="#526579" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400">integer pixel 0…255</text>
